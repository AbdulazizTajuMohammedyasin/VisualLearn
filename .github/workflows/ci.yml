name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: OpenCode integration (real binary, scripted mock model)
        run: |
          npm install --global opencode-ai@1.19.5
          VL_OPENCODE_BIN="$(command -v opencode)" npm run test:opencode

  ui-library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-library
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-library/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: The app ships the current renderer
        run: |
          npm run build
          git diff --exit-code -- ../app/src/main/assets/openui/index.html

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest assembleDebug lintDebug
